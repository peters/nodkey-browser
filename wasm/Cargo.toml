[package]
name = "nodkey-wasm"
description = "nodkey-proto for the Nodkey browser extension (WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nodkey-proto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
wasm-bindgen = "0.2"

# Random numbers from crypto.getRandomValues on wasm32-unknown-unknown (nodkey-proto uses
# getrandom for ids and HPKE ephemeral keys).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
x25519-dalek = { version = "3.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
