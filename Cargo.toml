[workspace]
resolver = "3"
members = ["wasm", "tools/fake-relay"]
default-members = ["wasm", "tools/fake-relay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/peters/nodkey-browser"
publish = false

[workspace.dependencies]
# The protocol and the agent's side of it live in nodkey-cli; this repository depends on them by
# revision. Move the revision forward to take a protocol change.
nodkey-proto = { git = "https://github.com/peters/nodkey-cli", rev = "845ebea8d92800f2831c39f44ddc99e1d9c2ae82" }
nodkey-fake-relay = { git = "https://github.com/peters/nodkey-cli", rev = "845ebea8d92800f2831c39f44ddc99e1d9c2ae82" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
